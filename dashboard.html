<!doctype html><html data-theme="light"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Executive Insights Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: sticky brand bar, one centered 1280px column; admin = stacked panels, dashboard = KPI row then a 2-up chart grid then detail tables. */
:root{
  --bg:#f7f6fc; --surface:#ffffff; --surface-2:#f3f1fc; --line:#e7e4f4; --line-strong:#d6d1ee;
  --fg:#17143a; --fg-2:#4a4668; --muted:#6f6b8c;
  --accent:#3a1ff0; --accent-hover:#2d14d1; --accent-soft:#ece9ff; --accent-ink:#ffffff;
  --exec:#ff7a00; --exec-soft:#fff1e3; --exec-ink:#8a3e00;
  --c-del:#1E9E74; --c-ong:#EF7A12; --c-inp:#C2409A; --c-ide:#6656EE;
  --good:#127a55; --good-soft:#e3f5ee; --warn:#9a5a00; --warn-soft:#fff3dc; --crit:#c22f3c; --crit-soft:#fde8ea; --neutral-soft:#efedf6;
  --grid:#ebe8f5; --tooltip:#17143a; --tooltip-ink:#ffffff;
  --vt1:#C2409A; --vt2:#2F6FDB; --vt3:#B7791F; --vt4:#0E9AA7; --inv:#9a96b8;
  --shadow:0 1px 2px rgba(23,20,58,.05),0 4px 16px rgba(23,20,58,.04);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"Manrope","Inter",ui-sans-serif,system-ui,sans-serif;
  --hero-bg:#eeebff; --hero-ink:#17143a; --hero-muted:#565277; --hero-line:#d9d3fb; --hero-num:#3a1ff0; --hero-cost:#bdb5f2;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0d1f; --surface:#17152c; --surface-2:#1f1c3a; --line:#2b2748; --line-strong:#3a355e;
  --fg:#eeedf8; --fg-2:#c9c6e2; --muted:#a19dc0;
  --accent:#8f80ff; --accent-hover:#a395ff; --accent-soft:#272250; --accent-ink:#0f0d1f;
  --exec:#ff8a1f; --exec-soft:#3a2410; --exec-ink:#ffc48a;
  --c-del:#21966F; --c-ong:#D96A10; --c-inp:#D2509F; --c-ide:#7A6DFA;
  --good:#5ad3a3; --good-soft:#123327; --warn:#f2b250; --warn-soft:#352610; --crit:#ff7d88; --crit-soft:#3a1519; --neutral-soft:#24213f;
  --grid:#262241; --tooltip:#eeedf8; --tooltip-ink:#0f0d1f;
  --vt1:#D2509F; --vt2:#4F86E8; --vt3:#C08422; --vt4:#139FAA; --inv:#5e5a80;
  --hero-bg:#221d47; --hero-ink:#eeedf8; --hero-muted:#b4b0d4; --hero-line:#36305f; --hero-num:#a99dff; --hero-cost:#4d4685;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f0d1f; --surface:#17152c; --surface-2:#1f1c3a; --line:#2b2748; --line-strong:#3a355e;
  --fg:#eeedf8; --fg-2:#c9c6e2; --muted:#a19dc0;
  --accent:#8f80ff; --accent-hover:#a395ff; --accent-soft:#272250; --accent-ink:#0f0d1f;
  --exec:#ff8a1f; --exec-soft:#3a2410; --exec-ink:#ffc48a;
  --c-del:#21966F; --c-ong:#D96A10; --c-inp:#D2509F; --c-ide:#7A6DFA;
  --good:#5ad3a3; --good-soft:#123327; --warn:#f2b250; --warn-soft:#352610; --crit:#ff7d88; --crit-soft:#3a1519; --neutral-soft:#24213f;
  --grid:#262241; --tooltip:#eeedf8; --tooltip-ink:#0f0d1f;
  --vt1:#D2509F; --vt2:#4F86E8; --vt3:#C08422; --vt4:#139FAA; --inv:#5e5a80;
  --hero-bg:#221d47; --hero-ink:#eeedf8; --hero-muted:#b4b0d4; --hero-line:#36305f; --hero-num:#a99dff; --hero-cost:#4d4685;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.money,td.number,.kpi-value{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1280px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:18px;min-width:0}
.wordmark{font-weight:800;font-size:28px;letter-spacing:-.03em;color:var(--accent);line-height:1;position:relative}
.wordmark i{font-style:normal;position:relative}
.wordmark i::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--exec);top:-3px;left:50%;transform:translateX(-50%)}
.brand-sep{width:1px;height:38px;background:var(--line-strong)}
.brand-text{min-width:0}
.brand-meta{display:flex;align-items:center;gap:8px;color:var(--fg-2);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600;color:var(--fg-2);background:var(--surface);white-space:nowrap}
.chip.sample{border-color:transparent;background:var(--exec-soft);color:var(--exec-ink)}
.brand-title{font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.view-switch{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.view-switch button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.view-switch button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.view-switch button.exec[aria-pressed="true"]{background:var(--exec);color:#fff}
.user{position:relative}
.user-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px 6px 6px;cursor:pointer}
.avatar{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:.02em}
.user-name{font-weight:600;font-size:14px;line-height:1.2;text-align:left}
.user-mail{font-size:12px;color:var(--muted);text-align:left}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:260px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(23,20,58,.14);padding:6px;display:grid;gap:2px}
.menu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.menu button:hover{background:var(--surface-2)}
.menu button.on{background:var(--exec);color:#fff}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu svg,.btn svg{width:17px;height:17px;flex:none}

/* page */
main{max-width:1280px;margin:0 auto;padding-inline:24px;padding-block:24px 64px;display:grid;gap:20px}
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.notice svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--fg-2)}
.notice strong{display:block;font-weight:600}
.notice p{color:var(--fg-2);font-size:13.5px}
.notice .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.notice.sample{background:var(--exec-soft);border-color:transparent}
.notice.sample p,.notice.sample svg{color:var(--exec-ink)}
.eyebrow{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--exec-soft);color:var(--exec-ink)}
.hero{display:grid;gap:10px}
.hero h1{font-size:clamp(26px,3.4vw,40px);font-weight:800;letter-spacing:-.025em;line-height:1.1}
.hero p{color:var(--fg-2);font-size:16px;max-width:64ch}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:16px;min-width:0;align-content:start}
.panel > *{min-width:0}
.panel-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.panel-head > div:first-child{min-width:0;flex:1 1 280px}
.panel h2{font-size:16px;font-weight:700}
.panel h3{font-size:15px;font-weight:700}
.sub{color:var(--muted);font-size:13.5px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.seg{display:flex;gap:2px;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}
.btn.danger:hover{background:var(--crit-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%;padding:12px}
.icon-btn{border:0;background:transparent;width:30px;height:30px;border-radius:7px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn.del:hover{color:var(--crit);background:var(--crit-soft)}
.icon-btn svg{width:16px;height:16px}

/* dropzone */
.drop{border:1.5px dashed var(--line-strong);background:var(--surface-2);border-radius:var(--r);padding:36px 20px;display:grid;justify-items:center;gap:6px;text-align:center;cursor:pointer;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:34px;height:34px;color:var(--accent);margin-bottom:6px}
.drop strong{font-weight:600;font-size:15px}
.drop span{color:var(--muted);font-size:13.5px}
.status-box{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 18px;color:var(--fg-2);display:grid;gap:10px}
.status-box.ok{border-color:color-mix(in srgb,var(--good) 30%,var(--line))}
.status-box.err{border-color:color-mix(in srgb,var(--crit) 35%,var(--line));background:var(--crit-soft);color:var(--crit)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.vitem{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:start;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface);text-align:left;cursor:pointer;min-width:0}
.vitem[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.vitem .dot{margin-top:5px}
.vitem b{font-weight:600}
.vitem small{grid-column:2/4;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)} .dot.error,.dot.missing{background:var(--crit)}
.fine{font-size:13.5px;color:var(--fg-2)}

/* coverage cards */
.cover{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cover button{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 18px;cursor:pointer}
.cover button:hover{border-color:var(--accent);background:var(--accent-soft)}
.cover b{font-weight:600;font-size:15px}
.cover span{color:var(--muted)}
.count{min-width:28px;height:24px;padding:0 8px;border:1px solid var(--line-strong);border-radius:999px;display:inline-grid;place-items:center;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface)}

/* tabs */
.tabs-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;overflow-x:auto;scrollbar-width:thin}
.tabs{display:flex;gap:4px;width:max-content}
.tabs button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:500;font-size:14px;color:var(--fg-2);white-space:nowrap}
.tabs button:hover{background:var(--surface-2)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tabs .count{height:21px;min-width:24px;font-size:11.5px;border-color:var(--line);background:var(--surface-2);color:var(--fg-2)}
.tabs button[aria-selected="true"] .count{background:color-mix(in srgb,var(--accent-ink) 22%,transparent);border-color:transparent;color:var(--accent-ink)}

/* tables */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 14px 10px 40px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;max-width:340px}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.clickable{cursor:pointer}
td.money,td.number,th.r{text-align:right;white-space:nowrap}
td.title{font-weight:600;min-width:180px}
td.long{min-width:220px;color:var(--fg-2)}
td.actions{white-space:nowrap;text-align:right;width:1%}
.empty{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.pager .pg{display:flex;gap:6px;align-items:center}
.rowcount{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12.5px;padding:7px 12px;border-radius:9px;white-space:nowrap}
.confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--crit-soft);color:var(--crit);border-radius:var(--r-sm);padding:10px 14px;font-weight:500}
.confirm .spacer{min-width:8px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--neutral-soft);color:var(--fg-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:6px;min-width:0;align-content:start}
.kpi-label{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.kpi-label .dot{width:8px;height:8px}
.kpi-value{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.v-short{display:none}
.kpi-value small{font-size:14px;font-weight:600;color:var(--muted);margin-right:4px;letter-spacing:0}
.kpi-sub{font-size:12.5px;color:var(--fg-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.span2{grid-column:span 2}
.chart{position:relative;width:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{font-weight:600;color:var(--fg)}
.split{display:flex;height:16px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.split div{min-width:2px}
.split-rows{display:grid;gap:10px}
.split-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;font-size:13.5px}
.split-row i{width:10px;height:10px;border-radius:3px}
.split-row .pct{color:var(--muted);min-width:44px;text-align:right}
.donut-wrap{display:grid;grid-template-columns:minmax(0,180px) 1fr;gap:20px;align-items:center}
.list{display:grid;gap:0}
.list-item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item b{font-weight:600}
.list-item .meta{color:var(--muted);font-size:12.5px;grid-column:1/3;display:flex;gap:12px;flex-wrap:wrap}
.meter{display:flex;align-items:center;gap:8px;min-width:120px}
.meter-track{flex:1;height:6px;border-radius:3px;background:var(--neutral-soft);overflow:hidden}
.meter-fill{height:100%;border-radius:3px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px;align-content:start;min-width:0}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card b{font-weight:700;font-size:15px}
.card p{color:var(--fg-2);font-size:13.5px}
.card .kv{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.card .kv strong{color:var(--fg);font-weight:600}
.cat-head{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.decision{border-left:3px solid var(--line-strong);padding-left:14px}
.decision.high{border-left-color:var(--crit)} .decision.medium{border-left-color:var(--warn)} .decision.low{border-left-color:var(--good)}
.due{font-weight:600}
.due.soon{color:var(--crit)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,13,31,.45);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(860px,100%);max-height:calc(100dvh - 32px);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;border:1px solid var(--line)}
.modal-head,.modal-foot{padding:16px 20px;display:flex;align-items:center;gap:10px}
.modal-head{border-bottom:1px solid var(--line)}
.modal-foot{border-top:1px solid var(--line);justify-content:flex-end;flex-wrap:wrap}
.modal-body{padding:20px;overflow:auto;display:grid;gap:16px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.field{display:grid;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:var(--fg-2)}
.field label em{color:var(--crit);font-style:normal}
.field input,.field textarea,.field select{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:72px;resize:vertical}
.field .err{color:var(--crit);font-size:12px}

    cols:['Use Case Title','Description','Unit','Month','Year','End User','Focal Point','Vendor','Cost (OMR)','Complexity Level','Impact/Value','AI Type','AI Solution','OEC Approval Status','Stage','Budget Approved (OMR)','Remarks'], optional:['Stage'],

  { key:'ideation', name:'Ideation', desc:'Proposed AI initiatives', aliases:['Ideation','Ideas'], id:'Use Case Title',
    cols:['Use Case Title','Description','Unit','Month','Year','End User','Focal Point','Est. Cost (OMR)','Complexity Level','AI Type','AI Solution','Expected Impact','Remarks'],
    alt:{'Est. Cost (OMR)':['Estimated Cost (OMR)','Cost (OMR)','Est Cost']},

  { key:'evaluation', name:'Evaluation', desc:'Use cases from Ideation under evaluation', aliases:['Evaluation','Evaluations','Under Evaluation'], id:'Use Case Title',
    cols:['Use Case Title','Description','Unit','Month','Year','End User','Focal Point','Est. Cost (OMR)','Complexity Level','AI Type','AI Solution','Evaluation Status','Remarks'],
    alt:{'Est. Cost (OMR)':['Estimated Cost (OMR)','Cost (OMR)','Est Cost'],'Evaluation Status':['Status','Evaluation Stage']},
    types:{'Est. Cost (OMR)':'money','Year':'year','Description':'long','Remarks':'long'} },
  { key:'decision', name:'Decision Needed', desc:'Leadership decision items', aliases:['Decision Needed','Decisions Needed','Decision','Decisions'], id:'Decision Item',
    cols:['Decision Item','Description','Unit','Requested By','Decision Owner','Due Date','Value at Stake (OMR)','Priority','Status','Remarks'],
    alt:{'Decision Item':['Item','Decision','Title','Use Case Title'],'Value at Stake (OMR)':['Value (OMR)','Cost (OMR)','Amount (OMR)'],'Due Date':['Required By','Deadline']},
    types:{'Value at Stake (OMR)':'money','Due Date':'date','Description':'long','Remarks':'long'} },
  { key:'utilization', name:'Utilization', desc:'Adoption and usage tracking', aliases:['Utilization','Utilisation','Usage'], id:'Use Case',
    cols:['Use Case','Unit','Total Target Users','Active Users','Capacity Value','Actual Value','Monthly Usage','Utilization Rate','Trend'],
    alt:{'Use Case':['Use Case Title'],'Utilization Rate':['Utilisation Rate','Utilization %','Utilization']},
    types:{'Total Target Users':'number','Active Users':'number','Capacity Value':'number','Actual Value':'number','Utilization Rate':'percent'} },
  { key:'roi', name:'ROI', desc:'Financial performance summary', aliases:['ROI'], id:'Use Case',
    cols:['Use Case','Investment (OMR)','Annual Operating Cost','Annual Savings (OMR)','Without AI (Hours)','Annual Savings (Hours)','FTE','ROI %','Payback Period (years)','Status','Value Type'], optional:['Value Type','Without AI (Hours)','Annual Savings (Hours)'],
    alt:{'Use Case':['Use Case Title'],'Without AI (Hours)':['Without AI (Hour)','Without AI Hours','Hours Without AI','Without AI'],'Annual Savings (Hours)':['Annual Savings (Hour)','Annual Savings (Hour)2','Annual Savings (Hours)2','Hours Saved','Annual Hours Saved','Time Saved (Hours)'],'ROI %':['ROI','ROI (%)'],'Payback Period (years)':['Payback Period','Payback (years)','Payback'],'Annual Operating Cost':['Annual Operating Cost (OMR)','Operating Cost (OMR)']},
    types:{'Investment (OMR)':'money','Annual Operating Cost':'money','Annual Savings (OMR)':'money','Without AI (Hours)':'number','Annual Savings (Hours)':'number','FTE':'number','ROI %':'roi','Payback Period (years)':'number'} },

    types:{'Remarks':'long'} },

const BY_KEY = Object.fromEntries(SCHEMA.map(s => [s.key, s]));
const ENUMS = {
  'Month': MONTHS,
  'Complexity Level': ['Low','Medium','High'],
  'Impact/Value': ['Low','Medium','High'],
  'Expected Impact': ['Low','Medium','High'],
  'AI Type': ['Generative AI','Machine Learning','NLP','Computer Vision','Agentic AI','RPA + AI'],
  'OEC Approval Status': ['Approved','Pending','Rejected','Not Submitted'],
  'Priority': ['High','Medium','Low'],
  'Trend': ['Up','Flat','Down'],
  'Contract Type': ['PoC','Pilot','Framework','Commercial'],
  'Contract Status': ['Active','Negotiation','Expired','Terminated'],
  'Stage': ['On-going','In progress','On hold','Cancelled'],
  'Evaluation Status': ['Feasibility study','Business case','Approved for On-going','Rejected'],
  'Type': ['Startup','Local company','International company'],
  'Value Type': ['Revenue uplift','Cost saving','Customer experience','Risk reduction'],
  'Unit': ['Consumer','Business','Finance','Technology & Infrastructure','Strategy & Innovation','Digital & Applications','GRC','People'],
};
const STATUS_ENUMS = {
  decision:['Open','In review','Decided'], roi:['Realized','In progress','Projected'],
  products:['Live','Pilot','In development','Retired'], vendors:['Active','Pending','Expired'], agents:['Live','Pilot','Development','Paused'],
};

const nk = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
function num(v){
  if (v === null || v === undefined || v === '') return NaN;
  if (typeof v === 'number') return v;
  const s = String(v).replace(/[^0-9.\-]/g, '');
  if (!s || s === '-' || s === '.') return NaN;
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
}
/* Utilization Rate: "82%" -> 82, 0.82 -> 82, 82 -> 82 */
function pctVal(v){
  const n = num(v); if (isNaN(n)) return NaN;
  if (String(v).includes('%')) return n;
  return (n >= 0 && n <= 1.5) ? n * 100 : n;
}
function sheetDefFor(sheetName){
  const k = nk(sheetName);
  return SCHEMA.find(s => s.aliases.some(a => nk(a) === k));
}
function colMatcher(def){
  const list = def.cols.map(c => ({ c, keys:[nk(c), ...((def.alt && def.alt[c]) || []).map(nk)] }));
  return h => { const k = nk(h); if (!k) return null;
    const hit = list.find(x => x.keys[0] === k) || list.find(x => x.keys.includes(k));
    return hit ? hit.c : null; };
}
let __seq = 0;
const uid = () => 'r' + Date.now().toString(36) + (++__seq).toString(36);

function parseSheet(def, aoa){
  const match = colMatcher(def);
  let best = -1, bestScore = 0;
  for (let i = 0; i < Math.min(aoa.length, 15); i++){
    const score = new Set((aoa[i] || []).map(match).filter(Boolean)).size;
    if (score > bestScore){ bestScore = score; best = i; }
  }
  const base = { key:def.key, found:true, rows:[], matched:[], missing:def.cols.slice(), extra:[], blank:0, noId:0, numWarn:0 };
  if (best < 0 || bestScore < 2){
    return { ...base, status:'error', message:'No header row found. Put the column names in the first row.' };
  }
  const header = aoa[best];
  const map = header.map(match);
  const matched = def.cols.filter(c => map.includes(c));
  const opt = def.optional || [];
  const missing = def.cols.filter(c => !map.includes(c) && !opt.includes(c));
  const optMissing = opt.filter(c => !map.includes(c));
  const extra = header.map((h,i) => (String(h).trim() && !map[i]) ? String(h).trim() : null).filter(Boolean);
  const rows = []; let blank = 0, noId = 0, numWarn = 0;
  if (!map.includes(def.id)){
    return { ...base, matched, missing, extra, headerRow:best+1, status:'error', message:`Required column "${def.id}" is missing.` };
  }
  for (let r = best + 1; r < aoa.length; r++){
    const row = aoa[r] || []; const obj = {};
    map.forEach((col, i) => {
      if (!col) return;
      const val = String(row[i] ?? '').replace(/\s+/g,' ').trim();
      if (!val) return;
      if (!obj[col]) obj[col] = val;
      else if (col === 'Remarks' && obj[col] !== val) obj[col] += ' · ' + val;
    });
    if (!Object.keys(obj).length){ blank++; continue; }
    if (!obj[def.id]){ noId++; continue; }
    for (const [c,t] of Object.entries(def.types || {})){
      if (['money','number','roi','percent'].includes(t) && obj[c] && isNaN(num(obj[c]))) numWarn++;
    }
    obj._id = uid();
    rows.push(obj);
  }
  const status = missing.length ? 'warn' : 'ok';
  return { ...base, matched, missing, optMissing, extra, headerRow:best+1, rows, blank, noId, numWarn, status };
}

/* Full dates (day + year in the format) become yyyy-mm-dd regardless of the sheet's display format. */
function normalizeDates(ws){
  for (const a in ws){
    if (a[0] === '!') continue; const c = ws[a];
    if (c && c.t === 'n' && c.z && /d/i.test(String(c.z)) && /y/i.test(String(c.z)) && XLSX.SSF.is_date(c.z)) c.w = XLSX.SSF.format('yyyy-mm-dd', c.v);
  }
}
function parseWorkbook(wb, fileName){
  const report = { fileName, sheets:[], unknown:[] }; const data = {}; const seen = {};
  for (const sn of wb.SheetNames){
    const def = sheetDefFor(sn);
    if (!def){ report.unknown.push(sn); continue; }
    if (seen[def.key]){ report.unknown.push(`${sn} (second "${def.name}" sheet, ignored)`); continue; }
    seen[def.key] = sn;
    normalizeDates(wb.Sheets[sn]);
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, raw:false, defval:'', blankrows:false, dateNF:'yyyy-mm-dd' });
    const res = parseSheet(def, aoa); res.sourceName = sn;
    report.sheets.push(res);
    data[def.key] = res.status === 'error' ? [] : res.rows;
  }
  for (const def of SCHEMA){
    if (!seen[def.key]){
      report.sheets.push({ key:def.key, found:false, status:'missing', rows:[], matched:[], missing:def.cols.filter(c => !(def.optional||[]).includes(c)), extra:[], blank:0, noId:0, numWarn:0, message:'Sheet not found in the workbook.' });
      data[def.key] = [];
    }
  }
  report.sheets.sort((a,b) => SCHEMA.findIndex(s => s.key===a.key) - SCHEMA.findIndex(s => s.key===b.key));
  report.importable = report.sheets.some(s => s.status === 'ok' || s.status === 'warn');
  return { report, data };
}

function exportValue(def, col, v){
  const t = (def.types || {})[col];
  if (v === undefined || v === null) return '';
  if (['money','number','year'].includes(t)){ const n = num(v); return isNaN(n) ? v : n; }
  return v;
}
function buildWorkbook(data, keys, headersOnly){
  const wb = XLSX.utils.book_new();
  for (const k of keys){
    const def = BY_KEY[k];
    const aoa = [def.cols];
    if (!headersOnly) for (const r of (data[k] || [])) aoa.push(def.cols.map(c => exportValue(def, c, r[c])));
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = def.cols.map(c => ({ wch: Math.max(12, Math.min(40, c.length + 4, (def.types||{})[c]==='long' ? 40 : 28)) }));
    XLSX.utils.book_append_sheet(wb, ws, def.name);
  }
  return wb;
}
if (typeof module !== 'undefined') module.exports = { SCHEMA, parseWorkbook, buildWorkbook, num, pctVal };
</script>

/* ---------- downloads ---------- */
async function saveWorkbook(wb, filename){
  const out = XLSX.write(wb, { bookType:'xlsx', type:'array' });
  const blob = new Blob([out], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const dl = await dlPromise;
  if (dl){
    try { await dl.save({ filename, data: blob }); toast(`Saved ${filename}`); }
    catch (e){ if (e && e.code === 'declined') toast('Download cancelled'); else toast(`Could not save ${filename}. ${e && e.message ? e.message : ''}`, 'error'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(`Downloading ${filename}`);
}

      <div class="vgrid">${r.sheets.map(s => {

             s.noId ? `${s.noId} skipped without ${def.id}` : '', s.numWarn ? `${s.numWarn} non-numeric amounts` : '',

    <div><h2>Workbook upload</h2><p class="sub">Validate and load all sheets as the complete in-memory dataset.</p></div>

  <section class="panel">
    <div><h2>Dashboard targets</h2><p class="sub">Used to flag ROI and utilization below target on the C-level dashboard. Saved in this browser.</p></div>
    <div class="targets">${[['roi','ROI target','Use cases and units below this ROI are shown in red'],['util','Utilization rate target','Use cases below this rate are flagged'],['delivery','Delivery rate target','Delivered ÷ delivered and on-going use cases']].map(([k,l,h]) => `<div class="field"><label for="target-${k}">${l} (%)</label><input id="target-${k}" data-target="${k}" type="number" min="0" max="1000" step="1" value="${S.targets[k]}"><span class="sub" style="font-size:12px">${h}</span></div>`).join('')}</div>
    <button class="btn sm" data-act="reset-targets" style="justify-self:start">Reset to 50%, 70% and 80%</button>

function viewRecords(){
  const def = BY_KEY[S.recSheet];

  const slice = rows.slice((S.recPage-1)*PAGE_SIZE, S.recPage*PAGE_SIZE);

  return `<div class="tabs-wrap"><div class="tabs" role="tablist">${SCHEMA.map(s => `<button role="tab" data-act="rec-sheet" data-k="${s.key}" aria-selected="${s.key===def.key}">${esc(s.name)} <span class="count">${S.data[s.key].length}</span></button>`).join('')}</div></div>
  <section class="panel">
    <div class="panel-head">
      <div><h2>${esc(def.name)} records</h2><p class="sub">Add, edit, filter, and export records from the ${esc(def.name)} sheet. Identity column: ${esc(def.id)}.</p></div>

        <button class="btn danger" data-act="ask-clear" data-v="all">${ICON.trash} Clear all tabs</button>
      </div>
    </div>
    ${conf && (conf.type==='sheet' || conf.type==='all') ? `<div class="confirm">${conf.type==='all' ? `Delete every record in all ${SCHEMA.length} tabs?` : `Delete all ${all.length} ${esc(def.name)} records?`} This cannot be undone.<span class="spacer"></span>

    <div class="search">${ICON.search}<input id="rec-search" type="search" placeholder="Search ${esc(def.name.toLowerCase())}…" value="${esc(S.recQuery)}" aria-label="Search records"></div>
    <div id="rec-table">${recTable(def, all, rows, slice, pages)}</div>

}
function recTable(def, all, rows, slice, pages){
  const body = !all.length ? `<div class="empty">No rows yet. Upload the workbook or add a record.<button class="btn primary sm" data-act="add">${ICON.plus} Add ${esc(def.name)}</button></div>`
    : !rows.length ? `<div class="empty">No records match “${esc(S.recQuery)}”.</div>`
    : tableHTML(def, slice, { cols:def.cols, editable:true, clickable:false });
  const from = rows.length ? (S.recPage-1)*PAGE_SIZE+1 : 0, to = Math.min(S.recPage*PAGE_SIZE, rows.length);
  return `${body}<div class="pager" style="margin-top:14px"><span>Showing ${from}–${to} of ${rows.length} filtered rows. Page size: ${PAGE_SIZE}.</span>
    <div class="pg"><button class="btn sm" data-act="page" data-v="-1" ${S.recPage<=1?'disabled':''}>Previous</button><span class="chip">Page ${S.recPage} of ${pages}</span><button class="btn sm" data-act="page" data-v="1" ${S.recPage>=pages?'disabled':''}>Next</button></div></div>`;
}
function refreshRecTable(){
  const def = BY_KEY[S.recSheet]; const all = S.data[def.key]; const rows = filterRows(all, S.recQuery);
  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE)); S.recPage = Math.min(S.recPage, pages);
  $('#rec-table').innerHTML = recTable(def, all, rows, rows.slice((S.recPage-1)*PAGE_SIZE, S.recPage*PAGE_SIZE), pages);
  $('#rec-count').textContent = `${rows.length} of ${all.length} rows`;
}
function filterRows(rows, q){
  q = (q||'').trim().toLowerCase(); if (!q) return rows;
  return rows.filter(r => Object.entries(r).some(([k,v]) => k !== '_id' && String(v).toLowerCase().includes(q)));
}

/* shared table */
function cellHTML(def, col, v){
  const t = (def.types||{})[col];
  if (col === 'Utilization Rate'){ const p = pctVal(v); return isNaN(p) ? esc(v||'—') : meter(p); }
  if (PILL_COLS.has(col)) return pill(v);
  if (t === 'money' || t === 'number'){ const n = num(v); return isNaN(n) ? esc(v||'') : (t==='money' ? fmtOMR(n) : n.toLocaleString('en-US',{maximumFractionDigits:2})); }
  if (t === 'roi'){ const n = roiVal({ 'ROI %':v }); return isNaN(n) ? esc(v||'') : fmtPct1(n); }
  if (t === 'date') return v ? esc(fmtDate(v)) : '';
  return esc(v ?? '');
}
function tdClass(def, col){
  const t = (def.types||{})[col];
  if (col === def.id) return 'title';
  if (t === 'money') return 'money'; if (t === 'number' || t === 'roi' || t === 'year') return 'number';
  if (t === 'long') return 'long'; return '';
}
const cellVal = (r, c) => c === 'Month/Year' ? [r.Month, r.Year].filter(Boolean).join(' ') : c === 'Stage' ? ongoingStage(r) : r[c];
function tableHTML(def, rows, { cols, editable=false, clickable=true, scroll=false }){
  const conf = S.confirm, t = c => (def.types||{})[c];
  const clipped = c => editable && !PILL_COLS.has(c) && c !== 'Utilization Rate' && !['money','number','roi','year','date'].includes(t(c));
  const td = (r, c) => { const v = cellVal(r, c), h = cellHTML(def, c, v);
    return `<td class="${tdClass(def,c)}">${clipped(c) ? `<div class="clip" title="${esc(v)}">${h || '<span class="sub">—</span>'}</div>` : h}</td>`; };
  return `<div class="table-wrap${scroll ? ' scroll' : ''}"><table class="${editable ? 'editable' : ''}"><thead><tr>${cols.map(c => `<th class="${['money','number','roi'].includes(t(c))?'r':''}">${esc(c)}</th>`).join('')}${editable?'<th class="r">Actions</th>':''}</tr></thead>
  <tbody>${rows.map(r => `<tr class="${clickable ? 'clickable' : ''}" ${clickable ? `data-act="detail" data-k="${def.key}" data-id="${r._id}"` : ''}>${cols.map(c => td(r, c)).join('')}
    ${editable ? `<td class="actions">${conf && conf.type==='row' && conf.id===r._id
      ? `<span style="color:var(--crit);font-weight:500;margin-right:6px">Delete?</span><button class="btn sm danger" data-act="do-delete" data-k="${def.key}" data-id="${r._id}">Delete</button> <button class="btn sm" data-act="cancel-confirm">Keep</button>`
      : `<button class="btn sm ghost" data-act="edit" data-k="${def.key}" data-id="${r._id}" aria-label="Edit ${esc(r[def.id])}">Edit</button><button class="btn sm ghost t-del" data-act="ask-delete" data-k="${def.key}" data-id="${r._id}" aria-label="Delete ${esc(r[def.id])}">Delete</button>`}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;
}
function meter(p){
  const c = p >= 75 ? 'var(--good)' : p >= 50 ? 'var(--warn)' : 'var(--crit)';
  return `<div class="meter"><div class="meter-track"><div class="meter-fill" style="width:${Math.max(0,Math.min(100,p))}%;background:${c}"></div></div><span class="num" style="min-width:38px;text-align:right">${p.toFixed(0)}%</span></div>`;
}

/* ---------- record form ---------- */
const SELECT_COLS = new Set(['Unit','Month','Year','Complexity Level','AI Type','AI Solution','Expected Impact','OEC Approval Status','Priority','Status','Trend','Contract Type','Contract Status','Value Type','Category','Sector','Evaluation Status','Type']);
function optionList(key, c, current){
  const base = c === 'Status' ? (STATUS_ENUMS[key] || []) : c === 'Year' ? (() => { const now = new Date().getFullYear(); const ys = SCHEMA.flatMap(d => S.data[d.key].map(r => parseInt(r.Year, 10))).filter(n => !isNaN(n)); const lo = Math.min(now - 3, ...ys), hi = Math.max(now + 3, ...ys); const out = []; for (let y = hi; y >= lo; y--) out.push(String(y)); return out; })() : (ENUMS[c] || []);
  const seen = c === 'Status' ? S.data[key].map(r => r[c]) : SCHEMA.flatMap(d => d.cols.includes(c) ? S.data[d.key].map(r => r[c]) : []);
  const m = new Map(); [...base, ...seen, current].forEach(v => { const t = String(v || '').trim(); if (t && !m.has(nk(t))) m.set(nk(t), t); });
  const list = [...m.values()];
  return c === 'Year' || c === 'Month' || base.length ? list : list.sort((x, y) => x.localeCompare(y));
}
function openForm(key, id, preset){
  const def = BY_KEY[key]; const row = id ? (S.data[key].find(r=>r._id===id) || {}) : (preset || {});
  const field = c => {
    const t = (def.types||{})[c]; const v = String(row[c] ?? '');
    const req = c === def.id; const fid = 'f-' + nk(c);
    let input;
    if (t === 'long') input = `<textarea id="${fid}" name="${esc(c)}">${esc(v)}</textarea>`;
    else if (SELECT_COLS.has(c)){
      const opts = optionList(key, c, v);
      input = `<select id="${fid}" name="${esc(c)}" data-other="1"><option value="">Select ${esc(c.toLowerCase())}</option>${opts.map(o => `<option value="${esc(o)}" ${nk(o) === nk(v) && v ? 'selected' : ''}>${esc(o)}</option>`).join('')}<option value="__other">Other (type a new value)</option></select>`;
    }
    else if (t === 'date') input = `<input id="${fid}" name="${esc(c)}" type="date" value="${esc(parseDate(v) ? isoDate(parseDate(v)) : '')}">`;
    else if (t === 'money' || t === 'number') input = `<input id="${fid}" name="${esc(c)}" inputmode="decimal" value="${esc(v)}" placeholder="0">`;
    else input = `<input id="${fid}" name="${esc(c)}" value="${esc(v)}" ${req?'required':''} placeholder="${t==='percent'||t==='roi' ? 'e.g. 82%' : ''}">`;
    return `<div class="field ${t==='long'?'wide':''}"><label for="${fid}">${esc(c)}${req?' <em>*</em>':''}</label>${input}</div>`;
  };
  $('#modal-root').innerHTML = `<div class="overlay" data-act="close-modal-bg"><form class="modal" id="rec-form" data-k="${key}" data-id="${id||''}" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="modal-head"><div style="min-width:0"><h2 id="mt" style="font-size:17px">${id ? 'Edit' : 'Add'} ${esc(def.name)} record</h2><p class="sub" style="font-size:13px">Fields follow the ${esc(def.name)} sheet in the upload template.</p></div><span class="spacer"></span><button type="button" class="icon-btn" data-act="close-modal" aria-label="Close">${ICON.close}</button></div>
    <div class="modal-body"><div id="form-error"></div><div class="fields">${def.cols.map(field).join('')}</div></div>
    <div class="modal-foot"><button type="button" class="btn" data-act="close-modal">Cancel</button><button type="submit" class="btn primary">${id ? 'Save changes' : 'Add record'}</button></div>
  </form></div>`;
  setTimeout(() => $('#rec-form [name]')?.focus(), 30);
}
function submitForm(form){
  const key = form.dataset.k, id = form.dataset.id, def = BY_KEY[key];
  const rec = {}; const errs = [];
  def.cols.forEach(c => { const el = form.elements[c]; if (!el) return; const v = el.value.replace(/\s+/g,' ').trim(); if (v) rec[c] = v; });
  if (!rec[def.id]) errs.push(`${def.id} is required.`);
  for (const [c,t] of Object.entries(def.types||{})) if (['money','number','year'].includes(t) && rec[c] && isNaN(num(rec[c]))) errs.push(`${c} must be a number.`);
  const dup = rec[def.id] && S.data[key].find(r => r._id !== id && nk(r[def.id]) === nk(rec[def.id]));
  if (dup && def.key !== 'vendors') errs.push(`A record named “${rec[def.id]}” already exists. Edit that record instead.`);
  if (errs.length){ $('#form-error').innerHTML = `<div class="form-error">${errs.map(esc).join('<br>')}</div>`; return; }
  if (id){ const i = S.data[key].findIndex(r=>r._id===id); rec._id = id; S.data[key][i] = rec; toast('Record updated'); }
  else { rec._id = uid(); S.data[key].unshift(rec); toast(`${def.name} record added`); }
  markEdited(); closeModal(); render();
}
function markEdited(){ if (S.source === 'empty') S.source = 'manual'; }
function closeModal(){ $('#modal-root').innerHTML = ''; S.vendorOpen = null; S.listCtx = null; if (S.confirm && S.confirm.type === 'row' && S.view === 'dashboard') S.confirm = null; }
/* After asking to delete a row: redraw only what shows it. */
function refreshAfterConfirm(){

  if (S.view === 'admin') return refreshRecTable();
  const k = sheetOf(S.dashTab), box = document.getElementById('mq-' + k);
  if (box && !['products','agents'].includes(k)) box.innerHTML = manageBody(k); else render();
}

function openDetail(key, id){
  const def = BY_KEY[key]; const r = S.data[key].find(x=>x._id===id); if (!r) return;
  $('#modal-root').innerHTML = `<div class="overlay" data-act="close-modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="modal-head"><div style="min-width:0"><div class="sub">${esc(def.name)}</div><h2 id="mt" style="font-size:18px">${esc(r[def.id])}</h2></div><span class="spacer"></span><button class="icon-btn" data-act="close-modal" aria-label="Close">${ICON.close}</button></div>
    <div class="modal-body"><dl class="detail" style="margin:0">${def.cols.filter(c=>c!==def.id).map(c => `<div class="${(def.types||{})[c]==='long'?'wide':''}"><dt>${esc(c)}</dt><dd>${r[c] ? cellHTML(def,c,r[c]) : '<span class="sub">—</span>'}</dd></div>`).join('')}</dl></div>
    <div class="modal-foot"><button class="btn" data-act="edit-from-detail" data-k="${key}" data-id="${id}">${ICON.edit} Edit</button><button class="btn primary" data-act="close-modal">Close</button></div>
  </div></div>`;
}

/* ---------- upload handling ---------- */
function handleFile(file){
  if (!file) return;
  S.uploadError = ''; S.pending = null; S.previewSheet = null;
  if (!/\.(xlsx|xlsm|xls)$/i.test(file.name)){ S.uploadError = `“${file.name}” is not an Excel workbook. Upload the .xlsx template.`; render(); return; }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array', cellNF:true });
      const res = parseWorkbook(wb, file.name);
      S.pending = res; S.previewSheet = res.report.sheets.find(s=>s.rows.length)?.key || null;
      if (!res.report.importable) S.uploadError = `None of the ${SCHEMA.length} template sheets in “${file.name}” could be read. Check the sheet names and header row against the template.`;

      `${x.r.Unit ? `<span>${esc(x.r.Unit)}</span>` : ''}${!isNaN(num(x.r['Active Users'])) ? `<span>${fmtInt(num(x.r['Active Users']))} of ${fmtInt(num(x.r['Total Target Users']))} users active</span>` : ''}${x.r.Trend ? `<span>Trend ${pill(x.r.Trend)}</span>` : ''}`)).join('')}</div>` : '<div class="empty">No utilization rows.</div>';
  }
  return `<section class="panel" id="rank-${kind}"><div class="panel-head"><div><h2>${title}</h2><p class="sub">${sub}</p></div>${seg}</div>${body}</section>`;

function scopedRows(key){ return stageScoped(key) ? S.data.ongoing.filter(r => S.dashTab === 'ongoing' ? stageGroup(r) === 'ongoing' : stageGroup(r) !== 'ongoing') : S.data[key]; }

/* One row per vendor: contracts, use cases and value combined. */
function vendorGroups(){
  const m = new Map();
  S.data.vendors.forEach(r => { const k = nk(r.Company); if (!k) return;
    const g = m.get(k) || { name:String(r.Company).trim(), rows:[] }; g.rows.push(r); m.set(k, g); });
  return [...m.values()].map(g => {
    const st = g.rows.map(r => parseDate(r['Start Date'])).filter(Boolean), en = g.rows.map(r => parseDate(r['End Date'])).filter(Boolean);
    const statuses = [...new Set(g.rows.map(r => (r.Status || '').trim()).filter(Boolean))];
    return { ...g,
      ids: g.rows.map(r => r['Contract ID']).filter(Boolean),
      cats: [...new Set(g.rows.map(r => r.Category).filter(Boolean))],
      contacts: [...new Set(g.rows.map(r => r.Contact).filter(Boolean))],
      useCases: g.rows.reduce((a, r) => a + (num(r['Use Cases']) || 0), 0),
      value: g.rows.reduce((a, r) => a + (num(r['Value (OMR)']) || 0), 0),
      start: st.length ? new Date(Math.min(...st)) : null, end: en.length ? new Date(Math.max(...en)) : null,
      status: statuses.find(isActive) || statuses[0] || '',
      type: (g.rows.map(r => String(r.Type || '').trim()).find(Boolean)) || '' };
  }).sort((a, b) => b.value - a.value);
}
function vendorTable(){
  const q = (S.dashQuery.vendors || '').trim().toLowerCase(), f = S.vendorStatus;
  const gs = vendorGroups().filter(g => (!f || nk(g.status) === f) && (!q || [g.name, g.type, ...g.ids, ...g.cats, ...g.contacts, g.status].some(v => String(v).toLowerCase().includes(q))));
  const c = document.getElementById('mq-count-vendors'); if (c) c.textContent = pl(gs.length, 'row');
  if (!gs.length) return `<div class="empty">No vendors${q || f ? ' match the search or status filter' : ''}.</div>`;
  return `<div class="table-wrap"><table><thead><tr><th>Company</th><th>Type</th><th>Contracts</th><th>Category</th><th class="r">Use Cases</th><th class="r">Value (OMR)</th><th>Start</th><th>End</th><th>Contact</th><th>Status</th></tr></thead>
    <tbody>${gs.map(g => `<tr class="clickable" data-act="vendor" data-v="${esc(g.name)}"><td class="title">${esc(g.name)}</td><td>${esc(g.type || '—')}</td>
      <td>${g.rows.length}${g.ids.length ? `<div class="sub" style="font-size:12px">${esc(listNames(g.ids, 2))}</div>` : g.rows.length ? '<div class="sub" style="font-size:12px">No contract ID</div>' : ''}</td>
      <td>${esc(g.cats.join(', '))}</td><td class="number">${fmtInt(g.useCases)}</td><td class="money">${fmtOMR(g.value)}</td>
      <td>${g.start ? fmtDate(isoDate(g.start)) : ''}</td><td>${g.end ? fmtDate(isoDate(g.end)) : ''}</td><td>${esc(listNames(g.contacts, 2))}</td><td>${pill(g.status)}</td></tr>`).join('')}</tbody></table></div>`;
}
function openVendor(name){
  const g = vendorGroups().find(x => nk(x.name) === nk(name));
  if (!g){ closeModal(); return; }
  S.vendorOpen = g.name; const def = BY_KEY.vendors, conf = S.confirm;
  const cols = ['Contract ID','Category','Use Cases','Value (OMR)','Start Date','End Date','Contact','Status'];
  $('#modal-root').innerHTML = `<div class="overlay" data-act="close-modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="modal-head"><div style="min-width:0"><div class="sub">Vendor</div><h2 id="mt" style="font-size:18px">${esc(g.name)}</h2></div><span class="spacer"></span><button class="icon-btn" data-act="close-modal" aria-label="Close">${ICON.close}</button></div>
    <div class="modal-body"><div class="kv-row"><span>${pl(g.rows.length, 'contract')}</span><span>${pl(g.useCases, 'use case')}</span><span>OMR ${fmtOMR(g.value)}</span></div>
      ${tableHTML(def, g.rows, { cols, editable:true, clickable:false })}</div>
    <div class="modal-foot"><button class="btn" data-act="add" data-k="vendors">${ICON.plus} Add contract</button><button class="btn primary" data-act="close-modal">Close</button></div></div></div>`;
}
/* Number of companies per Type (Vendors sheet). */
function companyTypePanel(gs){
  const title = 'Distribution by company type', sub = 'Number of companies of each type.';
  if (!gs.length) return panel(title, sub, emptySheet('vendors'));
  const known = ENUMS.Type, pal = ['--vt1','--vt2','--vt3','--vt4'].map(tv);
  const types = countBy(gs.map(g => ({ Type:g.type })), 'Type');
  const color = t => { if (t === 'Not set') return tv('--inv'); const i = known.findIndex(k => nk(k) === nk(t)); return pal[i < 0 ? 3 : i]; };
  return panel(title, sub, `<div class="donut-wrap">${chartBox(190, el => round(el, 'doughnut', types.map(t => t[0]), types.map(t => t[1]), types.map(t => color(t[0])), v => pl(v, 'company', 'companies')))}
    <div class="split-rows">${types.map(([t, n]) => `<div class="split-row"><i style="background:${color(t)}"></i><span>${esc(t)}</span><b class="num">${pl(n, 'company', 'companies')}</b><span class="pct num">${Math.round(n / gs.length * 100)}%</span></div>`).join('')}</div></div>`);
}
function dashVendors(){
  const rows = S.data.vendors, gs = vendorGroups();
  const statuses = [...new Map(gs.filter(g => g.status).map(g => [nk(g.status), g.status])).entries()];
  return kpis([
    { label:'Unique Vendors', value:fmtInt(gs.length), icon:'bars' },
    { label:'Vendor Use Cases', value:fmtInt(sum(rows,'Use Cases')), icon:'check', tone:'good' },
    { label:'Vendor Value (OMR)', value:'OMR ' + fmtOMR(sum(rows,'Value (OMR)')), icon:'users', tone:'exec' },
  ]) + companyTypePanel(gs) + `<section class="panel">${manageHead('vendors', 'Vendors', 'One row per vendor with its contracts, use cases, and total value combined. Select a vendor to edit its contracts.', 'Add Vendors')}
    <div class="filter-row"><div class="search">${ICON.search}<input type="search" data-msearch="vendors" id="msearch-vendors" placeholder="Search vendors…" value="${esc(S.dashQuery.vendors || '')}" aria-label="Search vendors"></div>
      <select id="vendor-status" aria-label="Filter by status"><option value="">All Status</option>${statuses.map(([k, l]) => `<option value="${esc(k)}" ${S.vendorStatus === k ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
    <div id="mq-vendors">${vendorTable()}</div></section>`;
}
function cardActions(key, r){
  const conf = S.confirm;
  return `<div class="card-actions">${conf && conf.type === 'row' && conf.id === r._id
    ? `<span class="t-crit">Delete this record?</span><button class="btn sm danger" data-act="do-delete" data-k="${key}" data-id="${r._id}">Delete</button><button class="btn sm" data-act="cancel-confirm">Keep</button>`
    : `<button class="btn sm" data-act="edit" data-k="${key}" data-id="${r._id}">Edit</button><button class="btn sm danger" data-act="ask-delete" data-k="${key}" data-id="${r._id}">Delete</button>`}</div>`;
}
function dashAgents(){
  const rows = S.data.agents;
  const st = countBy(rows,'Status');
  const cards = rows.length ? `<div class="cards pcards">${rows.map(r => `<article class="card pcard">
      <div class="card-top"><div style="min-width:0"><b>${esc(r['Agent Name'])}</b>${r.Owner ? `<div class="pcat">${esc(r.Owner)}</div>` : ''}</div>${pill(r.Status)}</div>
      <div><p style="color:var(--fg);font-weight:600">${r.Productivity ? esc(r.Productivity) : '<span class="sub" style="font-weight:400">No productivity figure yet</span>'}</p>${r.Remarks ? `<p>${esc(r.Remarks)}</p>` : ''}</div>
      ${cardActions('agents', r)}</article>`).join('')}</div>`
    : `<div class="empty">No AI agents yet.<button class="btn primary sm" data-act="add" data-k="agents">${ICON.plus} Add Agent</button></div>`;
  return kpis([{ label:'AI agents', value:fmtInt(rows.length) }, ...st.slice(0,3).map(([s,n]) => ({ label:s, value:fmtInt(n) }))])
    + `<section class="panel">${manageHead('agents', 'AI Agents', 'Agents from the AI Agents sheet.', 'Add Agent')}${cards}</section>`;
}

/* ---------- events ---------- */
const actions = {
  view(t){ S.view = t.dataset.v; S.menuOpen = false; S.confirm = null; try{ history.replaceState(null,'','#'+S.view); }catch(e){} render(); window.scrollTo({top:0}); },
  menu(){ S.menuOpen = !S.menuOpen; renderHeader(); },
  signout(){ S.signedOut = true; S.menuOpen = false; S.data = emptyData(); S.source = 'empty'; S.pending = null; render(); },
  signin(){ S.signedOut = false; S.view = 'admin'; S.adminTab = 'upload'; render(); },
  'admin-tab'(t){ S.adminTab = t.dataset.v; S.confirm = null; render(); },
  'go-upload'(){ S.view = 'admin'; S.adminTab = 'upload'; render(); window.scrollTo({top:0}); },
  'clear-sample'(){ S.data = emptyData(); S.source = 'empty'; toast('Sample data cleared'); render(); },
  'open-sheet'(t){ S.adminTab = 'records'; S.recSheet = t.dataset.k; S.recQuery = ''; S.recPage = 1; render(); },
  'rec-sheet'(t){ S.recSheet = t.dataset.k; S.recQuery = ''; S.recPage = 1; S.confirm = null; render(); },
  page(t){ S.recPage += +t.dataset.v; refreshRecTable(); },
  preview(t){ S.previewSheet = t.dataset.k; render(); },
  apply(){ applyImport(); },
  add(t){ const p = {}; if (t.dataset.stage) p.Stage = t.dataset.stage; if (t.dataset.name) p[BY_KEY[t.dataset.k].id] = t.dataset.name; openForm(t.dataset.k || S.recSheet, null, p); },
  edit(t){ openForm(t.dataset.k || S.recSheet, t.dataset.id); },
  'edit-from-detail'(t){ openForm(t.dataset.k, t.dataset.id); },
  'ask-delete'(t){ S.confirm = { type:'row', id:t.dataset.id }; refreshAfterConfirm(); },
  'do-delete'(t){ const k = t.dataset.k || S.recSheet; S.data[k] = S.data[k].filter(r=>r._id!==t.dataset.id); S.confirm = null; toast('Record deleted'); render(); if (S.vendorOpen) openVendor(S.vendorOpen); },
  'ask-clear'(t){ S.confirm = { type:t.dataset.v }; render(); },
  'do-clear'(t){ if (t.dataset.v === 'all'){ S.data = emptyData(); toast('All tabs cleared'); } else { S.data[S.recSheet] = []; toast(`${BY_KEY[S.recSheet].name} cleared`); } if (S.source==='sample' && t.dataset.v==='all') S.source='empty'; S.confirm = null; render(); },
  'cancel-confirm'(){ const wasRow = S.confirm && S.confirm.type==='row'; S.confirm = null; wasRow ? refreshAfterConfirm() : render(); },
  'ask-dclear'(t){ S.confirm = { type:'dclear', k:t.dataset.k }; render(); },
  'do-dclear'(t){ const k = t.dataset.k; if (stageScoped(k)){ const gone = new Set(scopedRows(k)); S.data[k] = S.data[k].filter(r => !gone.has(r)); } else S.data[k] = []; S.confirm = null; S.dashQuery[k] = ''; toast(`${BY_KEY[k].name} cleared`); render(); },
  vendor(t){ openVendor(t.dataset.v); },
  'export-template'(){ exportTemplate(); },
  growth(t){ S.growthMode = t.dataset.v; render(); },
  'growth-edit'(){ openGrowthEdit(); },
  'growth-reset'(){ const mode = (GROWTH_MODES[S.growthMode] ? S.growthMode : 'count') + '-'; Object.keys(S.growthManual).filter(k => k.startsWith(mode)).forEach(k => delete S.growthManual[k]); saveGrowth(); closeModal(); render(); toast('AI growth reset to the workbook values'); },
  rank(t){ S.rank[t.dataset.k] = t.dataset.v; const el = document.getElementById('rank-' + t.dataset.k); if (el) el.outerHTML = rankPanel(t.dataset.k); },
  'reset-targets'(){ S.targets = { ...DEFAULT_TARGETS }; saveTargets(); render(); toast('Targets reset'); },
  'export-sheet'(t){ exportSheet(t.dataset.k || S.recSheet); },
  'export-all'(){ exportAll(); },
  'export-sample'(){ exportSample(); },
  'dash-tab'(t){ S.dashTab = t.dataset.k; render(); },
  detail(t){ const k = t.dataset.k, r = (S.data[k] || []).find(x => x._id === t.dataset.id);
    if (r && ['delivered','ongoing','ideation','roi','utilization'].includes(k)){ S.listCtx = null; openProfile(r[BY_KEY[k].id]); } else openDetail(k, t.dataset.id); },
  profile(t){ if (!t.closest('.modal')) S.listCtx = null; openProfile(t.dataset.v); },
  'list-back'(){ const c = S.listCtx; if (!c) return closeModal(); const set = new Set(c.names.map(nk)); openList(c.title, c.sub, useCases().filter(u => set.has(u.key))); },
  'open-unit'(t){ openUnit(t.dataset.v); },
  segment(t){ openSegment(t.dataset.u, t.dataset.t, t.dataset.ul, t.dataset.tl); },
  'rank-measure'(t){ S.rankMeasure = t.dataset.v; const el = document.getElementById('rank-roi'); if (el) el.outerHTML = rankPanel('roi'); },
  'close-modal'(){ closeModal(); },
  'close-modal-bg'(t, e){ if (e.target === t) closeModal(); },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (S.menuOpen && !e.target.closest('.user')){ S.menuOpen = false; renderHeader(); }
  if (!t || t.disabled) return;
  const fn = actions[t.dataset.act]; if (fn){ if (t.tagName === 'BUTTON' && t.type !== 'submit') e.preventDefault(); fn(t, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#modal-root').innerHTML) closeModal(); else if (S.menuOpen){ S.menuOpen = false; renderHeader(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'drop'){ e.preventDefault(); $('#file-input').click(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role=button][data-act]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => { if (e.target.id === 'rec-form'){ e.preventDefault(); submitForm(e.target); } if (e.target.id === 'growth-form'){ e.preventDefault(); submitGrowth(e.target); } });
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.other && e.target.value === '__other'){
    const sel = e.target, inp = document.createElement('input');
    inp.id = sel.id; inp.name = sel.name; inp.placeholder = 'Type a new value'; sel.replaceWith(inp); inp.focus(); return; }
  const uk = e.target.dataset && e.target.dataset.ufilter;
  if (uk){ S.unitFilter[uk] = e.target.value; S.confirm = null; $('#mq-' + uk).innerHTML = manageBody(uk); return; }
  if (e.target.id === 'vendor-status'){ S.vendorStatus = e.target.value; $('#mq-vendors').innerHTML = vendorTable(); }
});
document.addEventListener('input', e => {
  const mk = e.target.dataset && e.target.dataset.msearch;
  if (mk){ S.dashQuery[mk] = e.target.value; S.confirm = null; $('#mq-' + mk).innerHTML = manageBody(mk); }
  const tk = e.target.dataset && e.target.dataset.target;
  if (tk){ const v = parseFloat(e.target.value); if (!isNaN(v) && v >= 0){ S.targets[tk] = v; saveTargets(); } }
  if (e.target.id === 'rec-search'){ S.recQuery = e.target.value; S.recPage = 1; S.confirm = null; refreshRecTable(); }
  const dk = e.target.dataset && e.target.dataset.dsearch;
  if (dk){ S.dashQuery[dk] = e.target.value; const def = BY_KEY[dk]; const rows = filterRows(S.data[dk], e.target.value);
    $('#dq-'+dk).innerHTML = rows.length ? tableHTML(def, rows, { cols:DASH_COLS[dk] }) : `<div class="empty">No records match “${esc(e.target.value)}”.</div>`;
    $('#dq-count-'+dk).textContent = `${rows.length} of ${S.data[dk].length}`; }
});
$('#file-input').addEventListener('change', e => { handleFile(e.target.files[0]); e.target.value = ''; });
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.remove('over'); handleFile(e.dataTransfer.files[0]); } });

/* re-draw charts when the theme changes */
let themeTimer;
const rerender = () => { clearTimeout(themeTimer); themeTimer = setTimeout(() => { if (S.view === 'dashboard' && !$('#modal-root').innerHTML) render(); }, 60); };
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerender); } catch(e){}
new MutationObserver(rerender).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });

render();
</script>

</body></html>
